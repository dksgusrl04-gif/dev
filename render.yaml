# Render Blueprint (선택). Render 대시보드에서 New → Blueprint 로 이 저장소를 고르면 아래 설정으로 만든다.
# 직접 New → Web Service 로 만들어도 된다 (README 3장).
services:
  - type: web
    name: production-rescheduler
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-server.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSCODE
        sync: false
